name: Release

# Push a tag matching the package.json version (git tag v1.4.0 && git push origin v1.4.0): the AppImage is built
# here, from the tagged sources, and published with its SHA-256 and latest-linux.yml (the AppImage's own updates).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm test
      - run: npm run check-data

      - name: Build the AppImage
        run: npm run dist

      - name: Vision regression
        run: xvfb-run -a npx electron scripts/vision-replay.cjs --check tests/vision

      - name: SHA-256 checksums
        shell: bash
        working-directory: release
        run: |
          sha256sum Deadlock-Blueprint-*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Deadlock Blueprint ${{ github.ref_name }}
          body_path: release/notes.md
          files: |
            release/Deadlock-Blueprint-*.AppImage
            release/latest-linux.yml
