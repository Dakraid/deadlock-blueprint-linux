name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and replay tests (recommendations, match rules, recorded games, translations)
        run: npm test
      - name: Generated data is valid
        run: npm run check-data
      - name: Build
        run: npm run build
      - name: Vision regression (the real scanner on saved game frames, in Electron)
        run: xvfb-run -a npx electron scripts/vision-replay.cjs --check tests/vision
